<div class="mask" id="mask">
  <div class="modal">
    <div class="mh">管理端密钥</div>
    <div class="mb">
      <p>请输入与后端一致的 SECRET_KEY（后端由环境变量注入）。密钥只保存在本机浏览器，不会写入页面源码。</p>
      <input id="key-input" type="password" placeholder="SECRET_KEY" autocomplete="off">
      <div class="mn">当前值前 8 位：<span id="key-hint">未配置</span></div>
    </div>
    <div class="mf">
      <button class="btn" id="key-cancel">取消</button>
      <button class="btn primary" id="key-save">保存并刷新</button>
    </div>

<script src="assets/admin.js?v=3"></script>
<script>
const { esc, fmtAge, ageOf } = PP;

function alertsHtml(alerts){
  if (!alerts.length) return '<div class="empty">当前无告警 —— 规则引擎每 10 秒扫描一次</div>';
  return alerts.map(a => {
    const done = !!a.resolved_at;
    return `<div class="al ${esc(a.level || "warning")} ${done ? "resolved" : ""}">
      <div class="h">
        <span class="rule-t">${esc(a.rule)}</span>
        <span class="di">${esc(a.device_id)}</span>
        <span class="pill ${a.level === "critical" ? "crit" : "warn"}">${a.level === "critical" ? "严重" : "预警"}</span>
        ${a.push_status === "failed" ? '<span class="pill crit">推送失败</span>' : ""}
        <span class="t">${done ? "已处理" : fmtAge(ageOf(a.triggered_at))}</span>
      </div>
      <div class="m">${esc(a.message)}</div>
      ${done ? "" : `<div class="act"><button class="btn sm" data-resolve="${esc(a.id)}">标记已处理</button></div>`}
    </div>`;
  }).join("");
}

function renderAlerts(alerts){
  const open = alerts.filter(a => !a.resolved_at);
  document.getElementById("al-count-full").textContent = alerts.length + " 条（未处理 " + open.length + "）";
  document.getElementById("alerts").innerHTML = alertsHtml(alerts.slice(0, 40));
  PP.setCounts({ alerts: open.length });
}

async function load(){
  if (!PP.getKey()){
    PP.setLive(false, "未配置密钥");
    PP.showErr("未配置管理端密钥：页面不含内置密钥，请点右上角「密钥」输入与后端一致的 SECRET_KEY");
    return;
  }
  try{
    const al = await PP.api("/api/alert/list");
    PP.showErr(null);
    PP.setLive(true, "实时");
    renderAlerts(al.alerts || []);
  }catch(e){
    PP.setLive(false, "断开");
    PP.showErr(e.message);
  }
}

document.getElementById("alerts").addEventListener("click", async (ev) => {
  const id = ev.target.getAttribute && ev.target.getAttribute("data-resolve");
  if (!id) return;
  ev.target.disabled = true;
  try{
    await PP.post("/api/alert/" + encodeURIComponent(id) + "/resolve");
    PP.showErr(null);
  }catch(e){ PP.showErr("标记失败：" + e.message); }
  load();
});

/* 测试推送：真发一条企微消息，结果如实展示（未配置就明确说不会真推） */
document.getElementById("btn-push").addEventListener("click", async (ev) => {
  const btn = ev.target;
  const msg = document.getElementById("push-msg");
  btn.disabled = true;
  msg.className = "pe-msg";
  msg.textContent = "推送中…";
  try{
    const r = await PP.postFull("/api/alert/test-push");
    const detail = (r.data && r.data.detail) || "";
    if (r.message === "success"){
      msg.className = "pe-msg ok";
      msg.textContent = "已推送：" + detail;
    }else{
      msg.className = "pe-msg bad";
      msg.textContent = (r.data && r.data.configured === false)
        ? "未配置 WECOM_WEBHOOK_URL，后端不会真实推送"
        : "推送失败：" + detail;
    }
  }catch(e){
    msg.className = "pe-msg bad";
    msg.textContent = "推送失败：" + e.message;
  }
  btn.disabled = false;
  setTimeout(() => { msg.textContent = ""; }, 8000);
});

PP.boot(load);
</script>
